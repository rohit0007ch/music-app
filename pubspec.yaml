name: melora_music
description: "Melora — Premium hybrid music player."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Audio playback — stable, actively maintained
  just_audio: ^0.9.44

  # Background playback + OS notification/lock-screen controls.
  # No stable release exists; beta label reflects API stability, not code quality.
  # Widely production-proven; required to integrate just_audio with Android
  # MediaBrowserService and iOS MPNowPlayingInfoCenter.
  just_audio_background: ^0.0.1-beta.17

  # Audio focus, interruption handling (calls, headset events).
  audio_session: ^0.1.21

  # Runtime permissions — READ_MEDIA_AUDIO (Android 13+), mediaLibrary (iOS).
  permission_handler: ^11.3.1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
